services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mood
      POSTGRES_USER: mood
      POSTGRES_PASSWORD: mood
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mood -d mood"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mood:mood@postgres:5432/mood
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./apps/backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mood:mood@postgres:5432/mood
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/healthz', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
